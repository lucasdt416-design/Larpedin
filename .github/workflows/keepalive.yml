# Render's free plan sleeps after 15 idle minutes. Ping it so judges never hit a cold start.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://larpedin-p1fd.onrender.com/api/health
