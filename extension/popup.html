<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; margin: 0; padding: 14px; font: 14px/1.4 system-ui, sans-serif; color: #1d2226; }
  h1 { font-size: 16px; margin: 0 0 8px; color: #0a66c2; display: flex; align-items: center; gap: 8px; }
  .chip { font-size: 11px; border: 1px solid #0a66c2; border-radius: 999px; padding: 1px 8px; }
  textarea { width: 100%; box-sizing: border-box; height: 110px; border: 1px solid #ccc; border-radius: 8px;
    padding: 8px; font: inherit; resize: vertical; }
  button { margin-top: 8px; background: #0a66c2; color: #fff; border: 0; border-radius: 999px;
    padding: 7px 18px; font: 600 13px system-ui, sans-serif; cursor: pointer; }
  button:disabled { opacity: .6; }
  #label { font-size: 12px; color: #666; margin-top: 12px; }
  #out { font-size: 18px; font-weight: 700; }
  a { display: block; margin-top: 12px; color: #0a66c2; font-size: 12px; }
</style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt="LarpedIn" width="24" height="24">Delarp <span class="chip">parody</span></h1>
  <textarea id="text" maxlength="3000" placeholder="Paste a LinkedIn post…"></textarea>
  <button id="go">Delarp</button>
  <div id="label"></div>
  <div id="out"></div>
  <a id="site" target="_blank">Open the full LarpedIn site</a>
  <script src="popup.js"></script>
</body>
</html>
