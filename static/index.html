<!DOCTYPE html>
<!--
  LarpedIn — class reference for the designer (style.css).
  States are classes, never inline styles.

  LAYOUT
    .app-header        top bar
    .brand             "LarpedIn" text wordmark (no LinkedIn logo/assets)
    .tagline           one-line pitch under the wordmark

  COMPOSER
    .composer          the input card (form)
    .composer-label    label above the textarea
    .composer-input    textarea; placeholder rotates through examples
    .vibe-label        "Pick a vibe" label
    .vibe-pills        group of the 4 vibe buttons
    .vibe-pill         one vibe button; .is-active = selected
    .vibe-emoji        emoji inside a pill
    .cringe            wrapper for the cringe slider
    .cringe-label      "Cringe level" label
    .cringe-slider     <input type="range"> 1-10
    .cringe-value      live text like "Level 7: Delusional"
    .generate-btn      submit button; .is-loading while waiting,
                       .is-warming while the server wakes up (/api/health)
    .shortcut-hint     "Ctrl/⌘ + Enter" hint text

  FEEDBACK
    .error-banner      inline error message (hidden when empty)

  RESULT
    .result            section that holds the generated card(s)
    .results-grid      container for cards (1 card now; 4 for "Try all 4 vibes")
    .result-item       one card + its actions
    .post-card         the fake feed post (<article>)
    .post-header       avatar + author block row
    .avatar            circle with the user's initials
    .post-author-block column with name / headline / meta
    .post-author       display name (editable, saved in localStorage)
    .post-headline     headline (editable, saved in localStorage)
    .post-meta         "1st · 2m · 🌐" line
    .parody-label      small "Parody" tag in the meta line
    .post-body         post text, line breaks preserved; clamped to ~5 lines
                       unless .is-expanded
    .see-more          "...see more" / "see less" toggle
    .post-stats        row with reactions (left) and counts (right)
    .reactions         reaction emoji + like count
    .reaction-emojis   the stacked reaction emoji
    .reaction-count    like count (animates up on render)
    .post-counts       "N comments · N reposts"
    .comment-count / .repost-count
    .action-bar        Like / Comment / Repost / Send row
    .action-btn        one action; .is-active when toggled on
    .post-comments     list of fake comments (only if backend sends them)
    .comment / .comment-author / .comment-title / .comment-text
    .post-actions      real buttons under the card (Copy + open LinkedIn)
    .share-btn         "Copy + open LinkedIn"
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LarpedIn</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💼</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <span class="brand">LarpedIn</span>
    <p class="tagline">Tell us what you actually did. We'll make it LinkedIn-worthy.</p>
  </header>

  <main>
    <form class="composer" id="composer">
      <label class="composer-label" for="text">What did you do today?</label>
      <textarea class="composer-input" id="text" rows="3" maxlength="500" placeholder="I touched grass"></textarea>

      <span class="vibe-label" id="vibe-label">Pick a vibe</span>
      <div class="vibe-pills" role="group" aria-labelledby="vibe-label">
        <button type="button" class="vibe-pill is-active" data-tone="thought leader" aria-pressed="true"><span class="vibe-emoji" aria-hidden="true">🧠</span> Thought leader</button>
        <button type="button" class="vibe-pill" data-tone="humble brag" aria-pressed="false"><span class="vibe-emoji" aria-hidden="true">😇</span> Humble brag</button>
        <button type="button" class="vibe-pill" data-tone="hustle bro" aria-pressed="false"><span class="vibe-emoji" aria-hidden="true">💪</span> Hustle bro</button>
        <button type="button" class="vibe-pill" data-tone="agree?" aria-pressed="false"><span class="vibe-emoji" aria-hidden="true">🤔</span> Agree?</button>
        <button type="button" class="vibe-pill" data-tone="laid off but grateful" aria-pressed="false"><span class="vibe-emoji" aria-hidden="true">🙏</span> Laid off but grateful</button>
        <button type="button" class="vibe-pill" data-tone="AI influencer" aria-pressed="false"><span class="vibe-emoji" aria-hidden="true">🤖</span> AI influencer</button>
        <button type="button" class="vibe-pill" data-tone="founder who failed 3 startups" aria-pressed="false"><span class="vibe-emoji" aria-hidden="true">🚀</span> Founder who failed 3 startups</button>
        <button type="button" class="vibe-pill" data-tone="recruiter" aria-pressed="false"><span class="vibe-emoji" aria-hidden="true">🎯</span> Recruiter</button>
        <button type="button" class="vibe-pill" data-tone="Gen Z intern" aria-pressed="false"><span class="vibe-emoji" aria-hidden="true">💅</span> Gen Z intern</button>
      </div>

      <div class="cringe">
        <label class="cringe-label" for="level">Cringe level</label>
        <input type="range" class="cringe-slider" id="level" min="1" max="10" value="5">
        <output class="cringe-value" id="level-value" for="level">Level 5: Dramatic</output>
      </div>

      <button type="submit" class="generate-btn is-warming" id="generate" disabled>Warming up the hustle...</button>
      <span class="shortcut-hint" id="shortcut-hint">Ctrl + Enter</span>
    </form>

    <p class="error-banner" id="error" role="alert" hidden></p>

    <section class="result" id="result" aria-live="polite" aria-label="Your post" hidden>
      <div class="results-grid" id="results"></div>
    </section>
  </main>

  <template id="post-card-template">
    <div class="result-item">
      <article class="post-card">
        <header class="post-header">
          <div class="avatar" aria-hidden="true"></div>
          <div class="post-author-block">
            <span class="post-author" contenteditable="plaintext-only" role="textbox" aria-label="Display name (editable)" spellcheck="false"></span>
            <span class="post-headline" contenteditable="plaintext-only" role="textbox" aria-label="Headline (editable)" spellcheck="false"></span>
            <span class="post-meta">1st · 2m · <span aria-label="Public">🌐</span> <span class="parody-label">Parody</span></span>
          </div>
        </header>
        <div class="post-body"></div>
        <button type="button" class="see-more" aria-expanded="false" hidden>...see more</button>
        <div class="post-stats">
          <span class="reactions"><span class="reaction-emojis" aria-hidden="true">👍❤️👏</span> <span class="reaction-count">0</span></span>
          <span class="post-counts"><span class="comment-count"></span> · <span class="repost-count"></span></span>
        </div>
        <div class="action-bar">
          <button type="button" class="action-btn" data-action="like" aria-pressed="false">👍 Like</button>
          <button type="button" class="action-btn" data-action="comment" aria-pressed="false">💬 Comment</button>
          <button type="button" class="action-btn" data-action="repost" aria-pressed="false">🔁 Repost</button>
          <button type="button" class="action-btn" data-action="send" aria-pressed="false">📨 Send</button>
        </div>
        <ul class="post-comments" hidden></ul>
      </article>
      <div class="post-actions">
        <button type="button" class="share-btn">Copy + open LinkedIn</button>
      </div>
    </div>
  </template>
  <script src="app.js"></script>
</body>
</html>
