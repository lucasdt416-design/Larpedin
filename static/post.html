<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{og_title}}</title>
<meta name="description" content="{{og_description}}">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{og_description}}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{og_image}}">
<meta name="twitter:title" content="{{og_title}}">
<meta name="twitter:description" content="{{og_description}}">
<meta name="theme-color" content="#0a66c2">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f2ee; color: rgba(0,0,0,.9); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: #0a66c2; }
  .top { background: #fff; border-bottom: 1px solid #e0dfdc; padding: 10px 16px; display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 5; }
  .brand { font-weight: 800; font-size: 20px; color: #0a66c2; text-decoration: none; letter-spacing: -.5px; }
  .tag { font-size: 11px; font-weight: 600; color: #666; border: 1px solid #ccc; border-radius: 99px; padding: 1px 8px; }
  main { max-width: 560px; margin: 16px auto 40px; padding: 0 12px; }
  .card { background: #fff; border-radius: 8px; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04); margin-bottom: 12px; }
  .pad { padding: 16px; }
  .author { display: flex; gap: 10px; align-items: flex-start; }
  .avatar { flex: none; width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg,#0a66c2,#5aa0e6); color: #fff; font-weight: 700; display: grid; place-items: center; font-size: 17px; }
  .avatar.sm { width: 36px; height: 36px; font-size: 13px; background: linear-gradient(135deg,#915907,#e7a33e); }
  .name { font-weight: 600; }
  .muted { color: rgba(0,0,0,.6); font-size: 13px; }
  .follow { margin-left: auto; color: #0a66c2; font-weight: 600; background: none; border: 0; font-size: 15px; cursor: pointer; padding: 0; }
  .body { white-space: pre-wrap; word-wrap: break-word; margin: 12px 0 0; }
  .body.clamp { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .more { background: none; border: 0; color: rgba(0,0,0,.6); font: inherit; cursor: pointer; padding: 0; float: right; }
  .more:hover { color: #0a66c2; text-decoration: underline; }
  .reacts { display: flex; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid #e8e8e8; }
  .actions { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px; }
  .btn { flex: 1 1 auto; min-height: 44px; border: 0; background: none; border-radius: 4px; font: 600 14px system-ui, sans-serif; color: rgba(0,0,0,.6); cursor: pointer; padding: 8px 10px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn:hover { background: rgba(0,0,0,.06); }
  .btn.primary { background: #0a66c2; color: #fff; border-radius: 99px; }
  .btn.primary:hover { background: #004182; }
  .btn.outline { border: 1px solid #0a66c2; color: #0a66c2; border-radius: 99px; }
  .btn.tedx { background: #e62b1e; color: #fff; border-radius: 99px; }
  .btn.tedx:hover { background: #b81f15; }
  .btn:disabled { opacity: .6; cursor: default; }
  .comment { display: flex; gap: 8px; margin-top: 12px; }
  .bubble { background: #f2f2f2; border-radius: 0 8px 8px 8px; padding: 8px 12px; flex: 1; }
  .bubble p { margin: 4px 0 0; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .bar { margin: 8px 0; }
  .bar .row { display: flex; justify-content: space-between; font-size: 13px; text-transform: capitalize; }
  .track { height: 8px; background: #e8e8e8; border-radius: 99px; overflow: hidden; margin-top: 3px; }
  .fill { height: 100%; width: 0; background: #0a66c2; border-radius: 99px; transition: width .9s ease; }
  .fill.overall { background: linear-gradient(90deg,#e7a33e,#e62b1e); }
  .badge { display: inline-block; margin-top: 10px; background: #fff4e0; color: #915907; border: 1px solid #f0c47a; border-radius: 99px; padding: 4px 12px; font-weight: 700; font-size: 13px; }
  .votes { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .votes strong { font-size: 22px; }
  .cta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cta .tedx { grid-column: 1 / -1; }
  .gone { text-align: center; padding: 40px 20px; }
  .gone .big { font-size: 48px; }
  .skel { height: 14px; background: #eee; border-radius: 4px; margin: 10px 0; }
  .foot { text-align: center; font-size: 12px; color: rgba(0,0,0,.5); }

  /* TEDx stage */
  #stage { position: fixed; inset: 0; z-index: 2000; background: radial-gradient(ellipse 60% 55% at 50% 35%, rgba(255,240,210,.22), rgba(0,0,0,0) 70%), #0b0b0b; color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 64px 20px 120px; }
  #stage.on { display: flex; }
  #stage::after { content: ""; position: absolute; left: 50%; bottom: -60px; transform: translateX(-50%); width: min(120vw, 900px); height: 160px; border-radius: 50%; background: radial-gradient(ellipse at center, #c8231a 0%, #8c120c 60%, #5a0a06 100%); box-shadow: 0 -10px 60px rgba(230,43,30,.35); }
  .tedtag { position: absolute; top: 16px; left: 16px; font-weight: 900; font-size: 20px; letter-spacing: -.5px; }
  .tedtag b { color: #e62b1e; }
  .tedtag span { font-weight: 300; }
  #closeStage { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 99px; padding: 10px 16px; font: 600 14px system-ui, sans-serif; cursor: pointer; z-index: 2; }
  #speech { position: relative; z-index: 1; max-width: 760px; max-height: 100%; overflow-y: auto; font-size: clamp(20px, 4.2vw, 34px); line-height: 1.35; font-weight: 600; white-space: pre-wrap; text-align: center; text-shadow: 0 2px 20px rgba(0,0,0,.6); }
  #speech .w { color: rgba(255,255,255,.35); transition: color .15s; }
  #speech .w.said { color: rgba(255,255,255,.85); }
  #speech .w.now { color: #fff; background: #e62b1e; border-radius: 4px; box-shadow: 0 0 0 3px #e62b1e; }
  #speech .w.chunk { color: #fff; text-decoration: underline 3px #e62b1e; text-underline-offset: 6px; }
  #speech.plain .w { color: #fff; }
  .speaker { position: relative; z-index: 1; margin-top: 18px; font-size: 13px; color: rgba(255,255,255,.6); text-transform: uppercase; letter-spacing: 2px; }
  .ovation { position: absolute; z-index: 3; bottom: 40px; font-size: 34px; animation: rise 3s ease-out forwards; pointer-events: none; }
  .ovation-label { position: absolute; z-index: 3; top: 40%; font-size: clamp(26px, 6vw, 48px); font-weight: 900; animation: pop .5s ease-out; text-align: center; }
  @keyframes rise { to { transform: translateY(-90vh) rotate(25deg); opacity: 0; } }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .fill, #speech .w { transition: none; }
    .ovation { display: none; }
    .ovation-label { animation: none; }
  }
</style>
<script src="/nav.js" defer></script>
<link rel="stylesheet" href="/edition.css">
<link rel="icon" type="image/png" href="/icons/favicon.png">
</head>
<body>

<main id="main">
  <div class="card pad" aria-busy="true">
    <div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel"></div><div class="skel" style="width:70%"></div>
  </div>
</main>

<template id="tpl">
  <article class="card">
    <div class="pad">
      <div class="author">
        <div class="avatar" aria-hidden="true">LV</div>
        <div>
          <div class="name">A LarpedIn Visionary</div>
          <div class="muted headline"></div>
          <div class="muted">3h • Public</div>
        </div>
        <button class="follow" type="button">+ Follow</button>
      </div>
      <div class="body clamp"></div>
      <button class="more" type="button" hidden>...see more</button>
      <div style="clear:both"></div>
    </div>
    <div class="reacts muted"><span class="reactline"></span><span class="ccount"></span></div>
    <div class="pad comments" style="padding-top:4px"></div>
  </article>

  <section class="card pad">
    <h2>Cringe report</h2>
    <div class="bars"></div>
    <span class="badge"></span>
  </section>

  <section class="card pad votes">
    <div><strong class="vcount">0</strong> <span class="muted">upvotes</span></div>
    <button class="btn primary upvote" type="button">Upvote</button>
  </section>

  <section class="card pad cta">
    <button class="btn outline copy" type="button">Copy link</button>
    <a class="btn outline" href="/">Make your own</a>
    <button class="btn primary to-li" type="button" title="Copies the post and opens LinkedIn. Nothing is posted unless you paste and post it there yourself.">Copy + open LinkedIn</button>
    <button class="btn tedx" type="button">Present at TEDx</button>
  </section>
  <p class="foot">LarpedIn is a parody. No careers were harmed.</p>
</template>

<div id="stage" role="dialog" aria-modal="true" aria-label="TEDx presentation">
  <div class="tedtag"><b>TEDx</b><img src="/icons/wordmark.png" alt="LarpedIn" width="100" style="vertical-align:middle;background:white;padding:3px;border-radius:4px"></div>
  <button id="closeStage" type="button">✕ Close</button>
  <div id="speech"></div>
  <div class="speaker">A LarpedIn Visionary</div>
  <div class="speaker" id="waitLine" hidden>The speaker is taking the stage…</div>
</div>

<script>
const FAMOUS = ["Bill Gates", "Oprah", "Elon Musk", "Satya Nadella", "Your Mom", "Gary Vee", "Taylor Swift", "Sam Altman", "Mark Cuban", "Your Old Manager"];
const pick = a => a[Math.floor(Math.random() * a.length)];
const $ = (root, sel) => root.querySelector(sel);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const initials = s => (s || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("") || "?";
const id = (location.pathname.match(/\/p\/(\d+)/) || [])[1];
const main = document.getElementById("main");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let post = null;

function gone() {
  main.replaceChildren();
  const c = el("div", "card gone");
  c.append(el("div", "big", "404"), el("h2", null, "This post went back to being a normal day"),
    el("p", "muted", "Posts reset when the server restarts. Probably for the best."));
  const a = el("a", "btn primary", "Larp a new one");
  a.href = "/";
  c.append(a);
  main.append(c);
}

function render(p) {
  post = p;
  const frag = document.getElementById("tpl").content.cloneNode(true);
  $(frag, ".headline").textContent = p.headline || "";
  const who = (p.name || "").trim() || "A LarpedIn Visionary";
  $(frag, ".name").textContent = who;
  $(frag, ".avatar").textContent = p.name ? initials(p.name) : "LV";
  document.querySelector(".speaker").textContent = who;
  const body = $(frag, ".body"), more = $(frag, ".more");
  body.textContent = p.post || "";
  if ((p.post || "").length > 220 || (p.post || "").split("\n").length > 5) {
    more.hidden = false;
    more.onclick = () => { body.classList.remove("clamp"); more.remove(); };
  } else body.classList.remove("clamp");

  $(frag, ".follow").onclick = e => { e.target.textContent = "✓ Following"; };
  const n = (1000 + Math.floor(Math.random() * 9000)).toLocaleString();
  $(frag, ".reactline").textContent = `${pick(FAMOUS)} and ${n} others`;
  const comments = p.comments || [];
  $(frag, ".ccount").textContent = comments.length ? `${comments.length} comment${comments.length > 1 ? "s" : ""}` : "";
  const cbox = $(frag, ".comments");
  for (const c of comments) {
    const row = el("div", "comment");
    const b = el("div", "bubble");
    b.append(el("div", "name", c.name), el("div", "muted", c.title), el("p", null, c.text));
    row.append(el("div", "avatar sm", initials(c.name)), b);
    cbox.append(row);
  }
  if (!comments.length) cbox.remove();

  const bars = $(frag, ".bars"), fills = [];
  for (const k of ["buzzwords", "emojis", "humblebrag", "overall"]) {
    const v = Math.max(0, Math.min(100, Number((p.score || {})[k]) || 0));
    const bar = el("div", "bar"), row = el("div", "row"), track = el("div", "track"), fill = el("div", "fill" + (k === "overall" ? " overall" : ""));
    row.append(el("span", null, k), el("strong", null, v + "%"));
    track.setAttribute("role", "progressbar");
    track.setAttribute("aria-label", k);
    track.setAttribute("aria-valuenow", v);
    track.append(fill); bar.append(row, track); bars.append(bar);
    fills.push([fill, v]);
  }
  $(frag, ".badge").textContent = "" + (p.badge || "Suspiciously Normal");

  const vcount = $(frag, ".vcount"), up = $(frag, ".upvote");
  vcount.textContent = p.votes || 0;
  const key = "larpedin-voted-" + p.id;
  if (localStorage.getItem(key)) { up.disabled = true; up.textContent = "✓ Upvoted"; }
  up.onclick = async () => {
    up.disabled = true;
    try {
      const r = await fetch(`/api/gallery/${p.id}/vote`, { method: "POST" });
      if (r.status === 404) { up.textContent = "Post expired"; return; }
      if (!r.ok) throw new Error();
      vcount.textContent = (await r.json()).votes;
      localStorage.setItem(key, "1");
      up.textContent = "✓ Upvoted";
    } catch { up.disabled = false; up.textContent = "Try again"; }
  };

  const copy = $(frag, ".copy");
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); copy.textContent = "Copied!"; }
    catch { copy.textContent = "Copy failed, use the address bar"; }
    setTimeout(() => { copy.textContent = "Copy link"; }, 2000);
  };

  const toLi = $(frag, ".to-li");
  // Copy-paste only: LinkedIn's text prefill is unreliable (the mobile app ignores it),
  // so copy first, then open the composer. Nothing is posted for the user.
  toLi.onclick = async () => {
    try {
      await navigator.clipboard.writeText(p.post);
      toLi.textContent = "Copied! Paste it into LinkedIn";
      setTimeout(() => { toLi.textContent = "Copy + open LinkedIn"; }, 3000);
    } catch {
      // Clipboard blocked; the composer is still prefilled where LinkedIn supports it.
    }
    window.open("https://www.linkedin.com/feed/?shareActive=true&text=" + encodeURIComponent(p.post), "_blank", "noopener");
  };

  const tedx = $(frag, ".tedx");
  if (!("speechSynthesis" in window)) tedx.remove();
  else { tedx.onclick = present; tedx.onmouseenter = tedx.onfocus = warmVoice; }

  main.replaceChildren(frag);
  requestAnimationFrame(() => requestAnimationFrame(() => fills.forEach(([f, v]) => { f.style.width = v + "%"; })));
}

// ---- TEDx mode ----
const stage = document.getElementById("stage"), speech = document.getElementById("speech");
let voice = null, timers = [], utter = null, opener = null;
// Orpheus (Groq) is preferred; null = untested, false = failed once this session, so skip it.
let ttsWorks = null, run = 0, audio = null;
const aborts = new Set();
// ElevenLabs (/api/voice) is tried before Orpheus; same null/false meaning as ttsWorks.
let voiceWorks = null, warmP = null, raf = 0;
// Strip emoji so the voice doesn't read "clapping hands sign"; same length keeps char indexes aligned.
const cleanText = t => t.replace(/\p{Extended_Pictographic}/gu, m => " ".repeat(m.length));
const voiceBody = text => ({ method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, role: "tedx" }) });
const voiceOk = t => voiceWorks !== false && t.trim() && t.trim().length <= 2500;
// Hover/focus on the TEDx button: one request per page load to fill the server cache, result ignored.
function warmVoice() {
  const t = cleanText(post.post || "");
  if (!warmP && voiceOk(t)) warmP = fetch("/api/voice", voiceBody(t)).catch(() => {});
}
// POST /api/voice; resolves to {audio, starts, ...} or null on any failure/timeout/abort (never throws).
// Waits for a running warm-up first so the real request hits the cache instead of paying twice.
async function fetchVoice(text, ms) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
  aborts.add(ac);
  try {
    await Promise.race([warmP, new Promise(r => ac.signal.addEventListener("abort", r))]);
    const r = await fetch("/api/voice", { ...voiceBody(text), signal: ac.signal });
    return r.ok ? await r.json() : null;
  } catch { return null; }
  finally { clearTimeout(t); aborts.delete(ac); }
}
const b64Blob = (b64, type) => new Blob([Uint8Array.from(atob(b64), c => c.charCodeAt(0))], { type });
// Best English voice: Premium/Enhanced, then named favourites, then any en-*.
// (Network "Google" voices cut out after ~15s, but we speak one short sentence at a time.)
function bestVoice() {
  const en = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
  for (const re of [/Premium|Enhanced/i, /Daniel/, /Samantha/, /Alex/, /Google UK English Male/, /Google US English/]) {
    const v = en.find(v => re.test(v.name));
    if (v) return v;
  }
  return en[0] || null;
}
function loadVoice() { voice = bestVoice(); }
if ("speechSynthesis" in window) { loadVoice(); speechSynthesis.addEventListener("voiceschanged", loadVoice); }

// Browser voice, sentence by sentence from char `from`, with a dramatic pause between sentences
// (longer after "!" or "?"). o.onWord(i) gets absolute char indexes into text for highlighting.
function speakLines(text, from, gen, o) {
  const lines = [...text.slice(from).matchAll(/[\s\S]*?(?:[.!?]+["')\]]*(?=\s|$)|\n|$)/g)].filter(m => m[0].trim());
  const next = k => {
    if (gen !== run) return;
    if (k >= lines.length) return o.onDone && o.onDone();
    const s = lines[k][0], at = from + lines[k].index;
    // Kept in a global so Chrome doesn't garbage-collect it mid-speech (which drops onboundary/onend).
    const u = utter = new SpeechSynthesisUtterance(s);
    u.rate = o.rate; u.pitch = o.pitch; u.lang = "en-US";
    if (voice) { u.voice = voice; u.lang = voice.lang; }
    if (o.onWord) {
      o.onWord(at + s.search(/\S/)); // light up the first word even if onboundary never fires
      u.onboundary = e => { if (!e.name || e.name === "word") o.onWord(at + e.charIndex); };
    }
    u.onend = () => setTimeout(() => next(k + 1), /[!?]["')\]]*\s*$/.test(s) ? 700 : 350);
    speechSynthesis.speak(u);
  };
  next(0);
}

// ---- Stage sounds: Web Audio only (no files, no network). One context, made inside the tap for iOS. ----
let actx = null, master = null, noise = null;
function initSound() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!actx) {
    actx = new AC();
    noise = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate); // 2 s of white noise, reused
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === "suspended") actx.resume();
}
function bus() { // master gain (peak ~0.5); stopSounds() swaps in a fresh one
  if (!master) { master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination); }
  return master;
}
function stopSounds() {
  if (!master) return;
  const old = master; master = null;
  old.gain.setTargetAtTime(0, actx.currentTime, 0.01);
  setTimeout(() => old.disconnect(), 100);
}
// Linear ramps through [[seconds, value], ...] starting at t0.
function env(p, t0, pts) { p.setValueAtTime(pts[0][1], t0 + pts[0][0]); pts.slice(1).forEach(([t, v]) => p.linearRampToValueAtTime(v, t0 + t)); }
function filt(type, f, q) { const b = actx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }

// Warm low A-major swell (3 detuned saws through an opening lowpass). Returns its length in ms.
function sting() {
  if (!actx) return 0;
  const t = actx.currentTime + 0.02, g = actx.createGain(), lp = filt("lowpass", 250, 1);
  env(lp.frequency, t, [[0, 250], [0.9, 1600], [1.5, 400]]);
  env(g.gain, t, [[0, 0], [0.8, 0.22], [1.5, 0]]);
  lp.connect(g).connect(bus());
  [[110, -7], [138.59, 5], [164.81, -3]].forEach(([f, cents]) => {
    const o = actx.createOscillator();
    o.type = "sawtooth"; o.frequency.value = f; o.detune.value = cents;
    o.connect(lp); o.start(t); o.stop(t + 1.55);
  });
  return 1500;
}

// Crowd applause: a soft hiss bed plus ~100 short band-passed noise claps, rising then fading.
function applause(dur = 3.6) {
  if (!actx) return;
  const t0 = actx.currentTime + 0.02, out = bus();
  const level = x => Math.max(0, Math.min(1, x / 0.6, (dur - x) / 1.6));
  const bed = actx.createBufferSource(), bg = actx.createGain();
  bed.buffer = noise; bed.loop = true;
  env(bg.gain, t0, [[0, 0], [0.6, 0.08], [dur - 1.6, 0.07], [dur, 0]]);
  bed.connect(filt("bandpass", 1800, 0.6)).connect(bg).connect(out);
  bed.start(t0); bed.stop(t0 + dur);
  for (let i = 0; i < 160; i++) {
    const x = Math.random() * dur;
    if (Math.random() > level(x)) continue; // denser in the middle
    const s = actx.createBufferSource(), g = actx.createGain(), t = t0 + x;
    s.buffer = noise;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3 + Math.random() * 0.4, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03 + Math.random() * 0.05);
    s.connect(filt("bandpass", 900 + Math.random() * 1800, 1 + Math.random() * 1.5)).connect(g).connect(out);
    s.start(t, Math.random() * 1.8, 0.1);
  }
}

// Split into [start, end, text] chunks of at most max chars: at sentence ends, else commas, else spaces.
function chunks(t, max) {
  const lastCut = (s, re) => { let k = 0; for (const m of s.matchAll(re)) k = m.index + m[0].length; return k; };
  const out = [];
  for (let i = 0; i < t.length;) {
    let end = t.length;
    if (end - i > max) {
      const s = t.slice(i, i + max + 1);
      end = i + (lastCut(s, /[.!?]+["')]*\s+|\n+/g) || lastCut(s, /,\s+/g) || lastCut(s, /\s+/g) || max);
    }
    const c = t.slice(i, end).trim();
    if (c) out.push([i, end, c]);
    i = end;
  }
  return out;
}

// POST /api/tts; resolves to a wav Blob, or null on any failure/timeout/abort (never throws).
async function tts(text, voiceName, ms) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
  aborts.add(ac);
  try {
    const r = await fetch("/api/tts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, voice: voiceName }), signal: ac.signal });
    return r.ok ? await r.blob() : null;
  } catch { return null; }
  finally { clearTimeout(t); aborts.delete(ac); }
}

// Plays a blob; resolves true when it ends, false if it can't play.
// iOS/Safari only let audio start within ~1s of a tap, so unlockAudio() runs inside the click
// handler: it primes one shared <audio> (silent wav) and speechSynthesis; later plays reuse them.
const SILENT_WAV = "data:audio/wav;base64,UklGRiwAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQgAAACAgICAgICAgA==";
function unlockAudio() {
  if (!audio) { audio = new Audio(SILENT_WAV); audio.play().catch(() => {}); }
  initSound();
  if ("speechSynthesis" in window) {
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    speechSynthesis.speak(u);
  }
}

function playBlob(blob) {
  const url = URL.createObjectURL(blob);
  if (!audio) audio = new Audio();
  audio.src = url;
  return new Promise(res => {
    audio.onended = () => res(true);
    audio.onerror = () => res(false);
    audio.play().catch(() => res(false));
  }).finally(() => URL.revokeObjectURL(url));
}

function stopSpeech() {
  run++;
  cancelAnimationFrame(raf);
  document.getElementById("waitLine").hidden = true;
  stopSounds();
  aborts.forEach(a => a.abort());
  if (audio) {
    const end = audio.onended; // resolves a pending playBlob
    audio.onended = audio.onerror = null;
    audio.pause(); audio.removeAttribute("src"); audio.load();
    if (end) end();
  }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}

function present() {
  const text = post.post || "";
  speech.replaceChildren();
  speech.classList.add("plain");
  speech.scrollTop = 0;
  const words = []; // [startIndex, span]
  for (const m of text.matchAll(/\S+|\s+/g)) {
    if (/^\s/.test(m[0])) { speech.append(m[0]); continue; }
    const s = el("span", "w", m[0]);
    words.push([m.index, s]);
    speech.append(s);
  }
  opener = document.activeElement;
  stage.classList.add("on");
  document.body.style.overflow = "hidden";
  document.getElementById("closeStage").focus();

  stopSpeech();
  unlockAudio(); // still inside the TEDx button tap
  const gen = run;
  const intro = new Promise(r => setTimeout(r, sting())); // speech waits for the sting; TTS fetch doesn't
  const clean = cleanText(text);
  let cur = null;
  const finish = () => {
    if (gen !== run || !stage.classList.contains("on")) return;
    if (cur) cur.classList.remove("now");
    speech.classList.add("plain");
    ovation();
  };

  // Browser voice from char offset `from` to the end (fallback path).
  const onWord = at => {
    speech.classList.remove("plain");
    let i = words.length - 1;
    while (i > 0 && words[i][0] > at) i--;
    if (cur) { cur.classList.remove("now"); }
    for (let j = 0; j <= i; j++) words[j][1].classList.add("said");
    cur = words[i] && words[i][1];
    if (cur) { cur.classList.add("now"); cur.scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" }); }
  };
  const speakFrom = from => intro.then(() => speakLines(clean, from, gen, { rate: 0.9, pitch: 0.9, onWord, onDone: finish }));

  // 1) ElevenLabs: the whole post in one request, words lit from per-character start times.
  if (voiceOk(clean)) {
    const wait = document.getElementById("waitLine");
    wait.hidden = false;
    const voiceP = fetchVoice(clean, 12000); // runs in parallel with the sting
    return (async () => {
      const d = await voiceP;
      await intro;
      if (gen !== run) return;
      wait.hidden = true;
      if (d && d.audio) {
        // The server trims the text, so starts[0] is the first non-space char of clean.
        const lead = clean.length - clean.trimStart().length, starts = d.starts || [];
        const at = i => starts[Math.min(Math.max(i - lead, 0), starts.length - 1)];
        let i = -1;
        const tick = () => {
          let k = i;
          while (k + 1 < words.length && at(words[k + 1][0]) <= audio.currentTime) k++;
          if (k !== i) onWord(words[(i = k)][0]);
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        const ok = await playBlob(b64Blob(d.audio, d.mime || "audio/mpeg"));
        cancelAnimationFrame(raf);
        if (gen !== run) return;
        if (ok) { voiceWorks = true; words.forEach(w => w[1].classList.add("said")); return finish(); }
        words.forEach(w => w[1].classList.remove("said", "now"));
      }
      voiceWorks = false;
      orpheus();
    })();
  }
  orpheus();

  // 2) Orpheus in chunks, 3) the browser voice.
  function orpheus() {
    const TAGS = ["[dramatic] ", "[dramatic] ", "[excited] ", "[dramatic] ", "[dramatic] ", "[whisper] "];
    const parts = chunks(clean, 189); // 200-char API limit minus the longest tag
    if (ttsWorks === false || !parts.length) return speakFrom(0);

    // Any failure: remember it, drop the prefetch, and let the browser voice finish from this chunk.
    const fallback = from => { ttsWorks = false; aborts.forEach(a => a.abort()); speakFrom(from); };
    (async () => {
      const say = k => tts(TAGS[k % TAGS.length] + parts[k][2], "troy", k ? 15000 : 4000);
      let next = say(0);
      for (let k = 0; k < parts.length; k++) {
        const blob = await next;
        await intro;
        if (gen !== run) return;
        const [s, e] = parts[k];
        if (!blob) return fallback(s);
        next = k + 1 < parts.length ? say(k + 1) : null; // prefetch while this one plays
        const mine = words.filter(([i]) => i >= s && i < e).map(w => w[1]);
        speech.classList.remove("plain");
        mine.forEach(w => w.classList.add("chunk"));
        if (mine[0]) mine[0].scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" });
        const ok = await playBlob(blob);
        if (gen !== run) return;
        mine.forEach(w => { w.classList.remove("chunk"); if (ok) w.classList.add("said"); });
        if (!ok) return fallback(s);
        ttsWorks = true;
      }
      finish();
    })();
  }
}

function ovation() {
  const label = el("div", "ovation-label", "standing ovation");
  stage.append(label);
  applause();
  if (reduced) return;
  for (let i = 0; i < 40; i++) {
    timers.push(setTimeout(() => {
      const e = el("div", "ovation");
      e.style.left = Math.random() * 95 + "vw";
      e.style.animationDuration = 2 + Math.random() * 2 + "s";
      stage.append(e);
      timers.push(setTimeout(() => e.remove(), 4200));
    }, i * 90));
  }
}

function closeStage() {
  stopSpeech();
  timers.forEach(clearTimeout); timers = [];
  stage.querySelectorAll(".ovation, .ovation-label").forEach(e => e.remove());
  stage.classList.remove("on");
  document.body.style.overflow = "";
  if (opener) opener.focus();
}
document.getElementById("closeStage").onclick = closeStage;
addEventListener("keydown", e => { if (e.key === "Escape" && stage.classList.contains("on")) closeStage(); });

(async () => {
  if (!id) return gone();
  try {
    const r = await fetch("/api/post/" + id + location.search);
    if (!r.ok) return gone();
    render(await r.json());
  } catch { gone(); }
})();
</script>
</body>
