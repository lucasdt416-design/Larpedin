<!DOCTYPE html>
<!--
  LarpedIn live gallery — class reference for the designer (style.css).
  Shares .intro, .intro-title, .tagline, .intro-link, .error-banner, .avatar,
  .post-author, .post-headline, .post-meta, .parody-label, .post-body,
  .see-more, .badge with index.html. Top bar comes from nav.js.

    .gallery-page      <body> class for this page; .is-presenting in presenter mode
                       (fullscreen projector view, also via gallery.html?present)
    .gallery-toolbar   row with live stats + presenter button
    .gallery-stats     "🔥 23 larps · 5 delarps · 2 battles" from /api/stats
    .present-btn       toggles presenter mode
    .leaderboard       "Most cringe in the room" box (top 3 by score.overall)
    .leaderboard-header / .leaderboard-title
    .battle-link       <a> to /battle.html?a=<id>&b=<id> for the top two
    .leaderboard-list  <ol> of rows
    .leaderboard-row   one row; data-rank="1|2|3"
    .leaderboard-rank / .leaderboard-name / .leaderboard-text / .leaderboard-score
    .gallery-flash     big "New larp just dropped" banner (presenter mode)
    .gallery-layout    two columns: QR panel + feed
    .qr-panel          "Scan to post" box
    .qr-code           element the QR image is drawn into
    .qr-url            the URL printed under the QR
    .sort-toggle       Top / New switch above the feed (presenter mode starts on New)
    .sort-btn          one option; .is-active = current sort
    .gallery-feed      list of gallery posts (most votes first)
    .gallery-empty     shown when there are no posts yet
    .gallery-card      one post; .is-new briefly when it first appears
    .gallery-original  "What they actually did: ..." line
    .gallery-footer    badge + score + vote button row
    .gallery-score     "Cringe 81/100"
    .vote-btn          upvote button; .is-active after this browser voted
    .vote-count        number inside the vote button
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LarpedIn Gallery</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💼</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body class="gallery-page">
  <main>
    <section class="intro">
      <h1 class="intro-title">Hall of Larp</h1>
      <p class="tagline">The most delusional posts, live, voted by you. <a class="intro-link" href="/">Make your own →</a></p>
      <div class="gallery-toolbar">
        <p class="gallery-stats" id="stats" aria-live="polite"></p>
        <button type="button" class="present-btn" id="present" aria-pressed="false">📽️ Presenter mode</button>
      </div>
    </section>

    <div class="gallery-layout">
    <aside class="qr-panel" aria-label="Scan to post">
      <h2>Scan to LARP</h2>
      <div class="qr-code" id="qr" role="img" aria-label="QR code to open LarpedIn"></div>
      <p class="qr-url" id="qr-url"></p>
    </aside>

    <section aria-label="Gallery posts">
      <p class="error-banner" id="error" role="alert" hidden></p>
      <section class="leaderboard" id="leaderboard" aria-labelledby="leaderboard-title" hidden>
        <div class="leaderboard-header">
          <h2 class="leaderboard-title" id="leaderboard-title">🏆 Most cringe in the room</h2>
          <a class="battle-link" id="battle-link" hidden>⚔️ Battle the top two</a>
        </div>
        <ol class="leaderboard-list" id="leaderboard-list"></ol>
      </section>
      <p class="gallery-empty" id="empty" hidden>No posts yet. Scan the code and be the first to larp.</p>
      <div class="sort-toggle" role="group" aria-label="Sort posts">
        <button type="button" class="sort-btn is-active" data-sort="top" aria-pressed="true">🔥 Top</button>
        <button type="button" class="sort-btn" data-sort="new" aria-pressed="false">🆕 New</button>
      </div>
      <ol class="gallery-feed" id="feed" aria-live="polite"></ol>
    </section>
    </div>
  </main>

  <div class="gallery-flash" id="flash" role="status" hidden></div>

  <template id="gallery-card-template">
    <li class="gallery-card">
      <header class="post-header">
        <div class="avatar" aria-hidden="true"></div>
        <div class="post-author-block">
          <span class="post-author"></span>
          <span class="post-headline"></span>
          <span class="post-meta"><span class="gallery-tone"></span> · <span class="parody-label">Parody</span></span>
        </div>
      </header>
      <p class="gallery-original"></p>
      <div class="post-body"></div>
      <button type="button" class="see-more" aria-expanded="false" hidden>...see more</button>
      <div class="gallery-footer">
        <span class="badge"></span>
        <span class="gallery-score"></span>
        <button type="button" class="vote-btn" aria-pressed="false">▲ <span class="vote-count">0</span></button>
      </div>
    </li>
  </template>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="nav.js" defer></script>
  <script src="gallery.js"></script>
</body>
</html>
